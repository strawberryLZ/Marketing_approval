﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>营销活动管理系统</title>
<script>
  window.MKT_DING_SDK_PROMISE = window.dd ? Promise.resolve() : new Promise((resolve) => {
    window.MKT_DING_SDK_READY = resolve;
  });
</script>
<script async src="/dingtalk.open-3.0.41.js" onload="window.MKT_DING_SDK_READY && window.MKT_DING_SDK_READY()" onerror="window.MKT_DING_SDK_READY && window.MKT_DING_SDK_READY()"></script>
<script>
  /* Excel 只在导入、导出模板或生成审批附件时需要，不能阻塞首页。 */
  window.MKT_LOAD_XLSX = () => {
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (window.MKT_XLSX_PROMISE) return window.MKT_XLSX_PROMISE;
    window.MKT_XLSX_PROMISE = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = '/xlsx.full.min.js?v=21';
      script.onload = () => window.XLSX ? resolve(window.XLSX) : reject(new Error('Excel 组件加载失败'));
      script.onerror = () => reject(new Error('Excel 组件加载失败，请检查网络后重试'));
      document.head.appendChild(script);
    });
    return window.MKT_XLSX_PROMISE;
  };
</script>
<script>
  /* 在业务脚本下载时同步核验当前钉钉成员；上次会话不作为本次身份。 */
  window.MKT_AUTH_PROMISE = (async () => {
    try {
      const params = new URLSearchParams(location.search);
      const fromUrl = String(params.get('corpId') || params.get('corpid') || '').trim();
      const handoff = String(params.get('handoff') || '').trim();
      const handoffPromise = /^[A-Za-z0-9_-]{32,128}$/.test(handoff) ?
        fetch('/api/ding/handoff?token=' + encodeURIComponent(handoff), { cache: 'no-store' })
          .then((r) => r.json().then((j) => ({ ok: r.ok, body: j })))
          .then(({ ok, body }) => ok && body.success && body.user && body.user.userId ? body.user : null)
          .catch(() => null) : Promise.resolve(null);
      const corpPromise = /^ding[a-z0-9]+$/i.test(fromUrl) ? Promise.resolve(fromUrl) :
        fetch('/api/ding/login-context', { cache: 'no-store' }).then((r) => r.json()).then((j) => j.success ? String(j.corpId || '') : '');
      const sdkPromise = window.dd ? Promise.resolve() : (window.MKT_DING_SDK_PROMISE || Promise.resolve());
      const handoffUser = await handoffPromise;
      if (handoffUser) {
        if (history.replaceState) history.replaceState(null, '', location.pathname);
        return handoffUser;
      }
      const [corpId] = await Promise.all([corpPromise, sdkPromise]);
      if (!/^ding[a-z0-9]+$/i.test(corpId)) throw new Error('无法确认钉钉企业');
      window.MKT_CORP_ID = corpId;
      let ready = false;
      for (let i = 0; i < 20; i += 1) {
        if (window.dd?.runtime?.permission?.requestAuthCode) { ready = true; break; }
        await new Promise((resolve) => setTimeout(resolve, 150));
      }
      if (!ready) throw new Error('钉钉免登尚未就绪');
      const code = await new Promise((resolve, reject) => {
        const timeout = setTimeout(() => reject(new Error('钉钉免登响应超时')), 8000);
        const fail = (error) => { clearTimeout(timeout); reject(error); };
        const request = () => window.dd.runtime.permission.requestAuthCode({
          corpId,
          onSuccess: (result) => { clearTimeout(timeout); result?.code ? resolve(result.code) : reject(new Error('钉钉未返回免登码')); },
          onFail: fail,
        });
        try { if (typeof window.dd.ready === 'function') window.dd.ready(request); else request(); }
        catch (error) { fail(error); }
      });
      const response = await fetch('/api/ding/whoami', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ code }),
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.success || !result.userId) throw new Error('未能确认当前钉钉成员');
      return { userId: result.userId, name: result.name || '', source: '钉钉免登', allowManualBind: !!result.allowManualBind };
    } catch (error) { window.MKT_AUTH_ERROR = error.message || '钉钉免登失败'; return null; }
  })();
</script>
<link rel="stylesheet" href="styles.css?v=24">
<style>
  body.auth-pending .stage, body.auth-pending .foot { display:none; }
  body.auth-ready #auth-gate { display:none; }
  #auth-gate { margin:24px 32px; padding:28px; border-radius:16px; background:#fff; color:#617085; }
  #auth-retry { display:none; margin-top:14px; }
</style>
</head>
<body class="auth-pending">
  <!-- 顶部栏 -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">营销</div>
      <div class="brand-text">
        <h1>营销活动管理系统</h1>
        <span>跨平台价格联查 · 申请审查 · 记录归档</span>
      </div>
    </div>
    <div class="topbar-right">
      <div class="user-chip">
        <span class="avatar">?</span>
        <div class="user-meta">
          <b>正在识别操作人</b>
          <small>正在连接钉钉</small>
        </div>
      </div>
    </div>
  </header>

  <!-- 主导航 -->
  <nav class="tabs">
    <button class="tab active" data-view="apply">
      <span class="tab-ico">＋</span>活动申请 <span class="tab-load loading" data-tab-status="source">数据加载中</span>
    </button>
    <button class="tab" data-view="store-apply">
      <span class="tab-ico">▣</span>全店活动申请
    </button>
    <button class="tab" data-view="price-adjust">
      <span class="tab-ico">⇄</span>统一调价
    </button>
    <button class="tab" data-view="query">
      <span class="tab-ico">🔍</span>价格查询 <span class="tab-load loading" data-tab-status="source">数据加载中</span>
    </button>
    <button class="tab" data-view="approval">
      <span class="tab-ico">✓</span>审批跟踪
      <span class="badge" id="approval-badge">0</span>
      <span class="tab-load loading" data-tab-status="applications">记录加载中</span>
    </button>
  </nav>

  <div id="auth-gate" role="status" aria-live="polite">
    <span id="auth-gate-status">正在核验当前钉钉账号，完成后显示申请和审批数据…</span>
    <button class="btn ghost sm" id="auth-retry" type="button" onclick="location.reload()">重新识别</button>
  </div>
  <script data-auth-ui-bootstrap>
    /* 身份核验本身已在 head 中并行启动；不要等商品和 Excel 大脚本下载后才反馈已识别的成员。 */
    window.MKT_AUTH_PROMISE.then((user) => {
      if (!user || !user.userId) return;
      const name = String(user.name || '当前成员');
      const title = document.querySelector('.topbar .user-meta b');
      const subtitle = document.querySelector('.topbar .user-meta small');
      const avatar = document.querySelector('.topbar .avatar');
      const status = document.getElementById('auth-gate-status');
      if (title) title.textContent = name;
      if (subtitle) subtitle.textContent = '钉钉免登 · 正在加载页面数据';
      if (avatar) avatar.textContent = name.slice(0, 1);
      if (status) status.textContent = '已识别当前成员，正在加载页面数据…';
    }).catch(() => { /* 失败提示仍由 app.js 的统一身份处理展示。 */ });
  </script>

  <main class="stage">
    <!-- ========== 视图：活动申请 ========== -->
    <section class="view active" id="view-apply">
      <div class="layout">
        <!-- 左：申请信息 -->
        <aside class="panel form-panel">
          <h2 class="panel-title">申请信息</h2>
          <div class="field">
            <label>活动平台 <small style="color:var(--txt2)">（可多选）</small></label>
            <div class="ms-field" id="f-platform"></div>
          </div>
          <div class="field">
            <label>活动店铺 <small style="color:var(--txt2)">（可多选，随所选平台联动）</small></label>
            <div class="ms-field" id="f-store"></div>
          </div>
          <div class="field">
            <label>活动类型</label>
            <select id="f-activity"></select>
          </div>
          <div class="field-row">
            <div class="field">
              <label>开始时间</label>
              <input id="f-start" type="date">
            </div>
            <div class="field">
              <label>结束时间</label>
              <input id="f-end" type="date">
            </div>
          </div>
          <div class="rule-hint" id="rule-hint"></div>
          <div class="cost-form" id="cost-form"></div>

          <div class="divider"></div>
          <h2 class="panel-title">选择商品</h2>
          <div class="search-box">
            <input id="f-search" type="text" placeholder="搜索商品名 / 款号 / 款式简称">
          </div>
          <div class="filter-grid">
            <select id="fl-season"></select>
            <select id="fl-pos"></select>
            <select id="fl-grade"></select>
            <select id="fl-gender"></select>
          </div>
          <div class="pick-toolbar">
            <button class="btn ghost sm" id="btn-sel-all">全选当前筛选结果</button>
          </div>
          <div class="pick-list" id="pick-list"></div>
          <div class="pick-foot">
            <span id="pick-count">已选 0 个 SPU</span>
          </div>
        </aside>

        <!-- 右：明细填价 -->
        <div class="panel detail-panel">
          <div class="detail-head">
            <h2 class="panel-title">活动明细 · 填价</h2>
            <div class="detail-actions">
              <button class="btn ghost sm" id="btn-expand">展开全部</button>
              <button class="btn ghost" id="btn-clear">清空</button>
              <button class="btn primary" id="btn-submit">提交审批</button>
            </div>
          </div>
          <div class="table-wrap">
            <table class="grid" id="apply-table">
              <thead>
                <tr>
                  <th>SPU / 颜色 / SKU</th>
                  <th>吊牌价</th>
                  <th>零售价</th>
                  <th>建议最低价</th>
                  <th>历史最低价</th>
                  <th>库存</th>
                  <th>申请价</th>
                  <th>折扣</th>
                  <th>校验</th>
                </tr>
              </thead>
              <tbody id="apply-tbody">
                <tr class="empty-row"><td colspan="9">从左侧筛选并勾选 SPU 后，此处按 SPU → 颜色 → SKU 三级展开填价</td></tr>
              </tbody>
            </table>
          </div>
          <div class="summary-bar" id="summary-bar"></div>
        </div>
      </div>
    </section>

    <!-- ========== 视图：全店活动申请（免审批可由服务端直接创建明细和日历） ========== -->
    <section class="view" id="view-store-apply">
      <div id="store-activity-root"></div>
    </section>

    <!-- ========== 视图：统一调价审批（SPU 级，审批通过后写入调价同步表） ========== -->
    <section class="view" id="view-price-adjust">
      <div id="price-adjust-root"></div>
    </section>

    <!-- ========== 视图：价格查询 ========== -->
    <section class="view" id="view-query">
      <div class="panel">
        <h2 class="panel-title">跨平台价格联查</h2>
        <div class="query-bar">
          <input id="q-input" type="text" placeholder="输入商品名 / 款号，如 袋鼠裤 / FBMCS1">
          <button class="btn primary" id="q-btn">查询</button>
        </div>
        <div class="filter-grid query-filter-grid" aria-label="价格查询筛选条件">
          <select id="q-season" aria-label="季节筛选"></select>
          <select id="q-pos" aria-label="定位筛选"></select>
          <select id="q-grade" aria-label="等级筛选"></select>
          <select id="q-gender" aria-label="性别筛选"></select>
        </div>
        <div class="query-pick-list" id="q-pick-list" aria-live="polite"></div>
        <div id="q-result"></div>
      </div>
    </section>

    <!-- ========== 视图：审批跟踪 ========== -->
    <section class="view" id="view-approval">
      <div class="panel">
        <div class="panel-title-row">
          <h2 class="panel-title">审批跟踪</h2>
          <button class="btn ghost sm" id="ap-refresh" type="button">刷新审批状态</button>
        </div>
        <div class="filter-row" id="ap-filter">
          <button class="chip active" data-st="all">全部</button>
          <button class="chip" data-st="审批中">审批中</button>
          <button class="chip" data-st="已通过">已通过</button>
          <button class="chip" data-st="未通过">未通过</button>
          <button class="chip" data-st="草稿">草稿</button>
        </div>
        <div class="table-wrap">
          <table class="grid">
            <thead>
              <tr>
                <th>申请单号</th><th>平台 / 店铺</th><th>活动类型</th>
                <th>SKU 数</th><th>时间</th><th>状态</th><th>操作</th>
              </tr>
            </thead>
            <tbody id="ap-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <!-- 抽屉：申请单详情 / 审批 -->
  <div class="drawer-mask" id="drawer-mask"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-head">
      <h3 id="drawer-title">申请单详情</h3>
      <button class="drawer-close" id="drawer-close">✕</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </div>

  <!-- 弹窗 -->
  <div class="modal-mask" id="modal-mask">
    <div class="modal" id="modal"></div>
  </div>

  <div class="toast" id="toast"></div>

  <footer class="foot">营销活动管理系统</footer>

  <script defer src="data.js?v=21"></script>
  <script defer src="sample-data.js?v=21"></script>
  <script defer src="datasource.js?v=21"></script>
  <script defer src="app.js?v=31"></script>
  <script defer src="upload.js?v=26"></script>
</body>
</html>
