# 营销活动应用的专用 HTTPS 入口。
# 部署前先用 Certbot 为 clsp.flipbeltchina.com 签发证书，再启用下方 443 server 块。
server {
  listen 80;
  server_name clsp.flipbeltchina.com;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl http2;
  server_name clsp.flipbeltchina.com;

  ssl_certificate /etc/letsencrypt/live/clsp.flipbeltchina.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/clsp.flipbeltchina.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  client_max_body_size 12m;
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # 纵深防御：即使应用层配置错误，也不向 Web 暴露敏感文件或工程目录。
  location ~* ^/(?:config(?:\.json)?|.*\.(?:log|bak|backup|sql|pem|key|pfx|zip|tar|gz)|\.env|\.git)(?:/|$) { return 404; }
  location ~* ^/(?:tests|docs|deploy|research|data-analysis)(?:/|$) { return 404; }

  location = /api/ding/whoami {
    limit_req zone=marketing_login burst=20 nodelay;
    proxy_pass http://127.0.0.1:8760;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api/ding/events {
    limit_req zone=marketing_callback burst=30 nodelay;
    proxy_pass http://127.0.0.1:8760;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    limit_req zone=marketing_api burst=20 nodelay;
    proxy_pass http://127.0.0.1:8760;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://127.0.0.1:8760;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
